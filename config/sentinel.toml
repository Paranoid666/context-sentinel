# Paths are resolved relative to the server process working directory, not this file.
data_dir = ".context-sentinel"
workspace = "."
app_server_enabled = false
codex_executable = "codex"

[policy]
warn_score = 35
migrate_score = 65
warn_utilization = 0.65
migrate_utilization = 0.85
turn_warning = 40

[monitor]
enabled = true
warn_turns = 16
migrate_turns = 48
cooldown_turns = 8
cooldown_seconds = 600
